name: Nutrition 002L B1G recovery security

on:
  pull_request:
    branches: [codex/nutrition-002l-b1e-auth197]

permissions:
  contents: read

concurrency:
  group: nutrition-002l-b1g-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    if: github.event.pull_request.draft && github.event.pull_request.head.ref == 'codex/nutrition-002l-b1g-recovery-validation' && github.event.pull_request.head.repo.full_name == github.repository
    name: B1G CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Check out exact security candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up security Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Initialize pinned CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze without code-scanning mutation
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/nutrition-002l-b1g-sarif
      - name: Require successful zero-findings analysis
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          ANALYSIS_LANGUAGE: ${{ matrix.language }}
        run: node scripts/nutrition-002g/check-sarif.mjs "$RUNNER_TEMP/nutrition-002l-b1g-sarif" "$RUNNER_TEMP/nutrition-002l-b1g-security.json"
      - name: Record static security result
        run: cat "$RUNNER_TEMP/nutrition-002l-b1g-security.json" >> "$GITHUB_STEP_SUMMARY"
