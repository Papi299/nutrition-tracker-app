name: Nutrition 002E application recovery checkpoint 1

on:
  pull_request:
    branches: [codex/nutrition-002c1b-ddl-stability]

permissions:
  contents: read

concurrency:
  group: nutrition-002e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: 002E contract and trusted replay inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm ci
      - name: Check contracts and existing recovery regressions
        run: |
          node scripts/check-workflow-security.mjs
          node --test scripts/nutrition-002e/contracts.test.mjs scripts/nutrition-002c1b/contracts.test.mjs scripts/nutrition-002c1a/contracts.test.mjs scripts/nutrition-002c1a/mapping.test.mjs scripts/nutrition-002c1/contracts.test.mjs scripts/nutrition-002c1/normalization.test.mjs scripts/nutrition-002c/contracts.test.mjs scripts/check-workflow-security.test.mjs scripts/phase-11i-recovery-contract.test.mjs scripts/phase-11i-populated-recovery.test.mjs scripts/phase-11i-public-verification.test.mjs scripts/phase-11i-psql-diagnostics.test.mjs scripts/phase-11i-cli-transport.test.mjs scripts/nutrition-002a-recovery.test.mjs
      - name: Check focused JavaScript
        run: node node_modules/eslint/bin/eslint.js scripts/nutrition-002e scripts/check-workflow-security.mjs scripts/check-workflow-security.test.mjs --max-warnings 0
      - name: Check incremental diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA..$HEAD_SHA"
      - name: Prepare reviewed local database image
        run: docker pull docker.io/supabase/postgres@sha256:28f0e16a019e648089fc1a6d333549a55548f6019c15ae4bd7cd58b989027518
      - name: Qualify two disposable clusters
        run: node scripts/nutrition-002e/qualify-local.mjs "$RUNNER_TEMP/nutrition-002e-local.json"
      - name: Record sanitized qualification without artifact storage
        run: cat "$RUNNER_TEMP/nutrition-002e-local.json" >> "$GITHUB_STEP_SUMMARY"

  security:
    name: 002E CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Check out exact security candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up security Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Initialize pinned CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze without code-scanning mutation
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/nutrition-002e-sarif
      - name: Validate analysis results
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          ANALYSIS_LANGUAGE: ${{ matrix.language }}
        run: node scripts/nutrition-002c1/check-sarif.mjs "$RUNNER_TEMP/nutrition-002e-sarif" "$RUNNER_TEMP/nutrition-002e-security.json"
      - name: Record analysis without artifact storage
        run: cat "$RUNNER_TEMP/nutrition-002e-security.json" >> "$GITHUB_STEP_SUMMARY"
